name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        run: |
          manifest_version=$(jq -r '.version' manifest.json)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi

      - name: Build extension
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Package extension
        run: |
          cd dist
          zip -r "../pintia-answer-extension-${GITHUB_REF_NAME}.zip" .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v heading="## ${GITHUB_REF_NAME}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" "pintia-answer-extension-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
