<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pintia 学习辅助工具</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div class="mark">P/</div>
        <div>
          <p class="kicker">LOCAL QUESTION ARCHIVE</p>
          <h1>Pintia 学习辅助工具</h1>
        </div>
      </header>

      <section class="status-panel" aria-live="polite">
        <span class="status-dot" id="status-dot"></span>
        <div>
          <p class="status-label" id="status-label">尚未检测题库</p>
          <p class="status-detail" id="status-detail">选择“检测题集”以刷新当前页面题目。</p>
        </div>
      </section>

      <button class="download-button detect-button" id="detect-button" type="button">
        <span>检测题集</span>
        <span class="arrow">↗</span>
      </button>
      <button class="assistant-button" id="open-assistant-button" type="button">打开/关闭答案助手 <span>↔</span></button>

      <p class="error" id="error" hidden></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
